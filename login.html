<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .login{
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        .login h1{
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .campo{
            margin-bottom: 20px;
        }

        .campo label{
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .campo input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .campo input:focus{
            border-color: #4facfe;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background-color: #00c6fb;
        }

        .cadastro{
            text-align: center;
            margin-top: 15px;
        }

        .cadastro a{
            text-decoration: none;
            color: #4facfe;
        }
    </style>
</head>

<body>

    <div class="login">
        <h1>Login</h1>

        <form>
            <div class="campo">
                <label>Email</label>
                <input type="email" placeholder="Digite seu email">
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">
            </div>

            <button type="submit">Entrar</button>

            <div class="cadastro">
                <p>Não possui conta?
                    <a href="#">Cadastre-se</a>
                </p>
            </div>
        </form>
    </div>

</body>
</html>
